name: llops

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to force (e.g. phase-01). Empty = auto-select."
        required: false
        default: ""
      review:
        description: "Run subagent review + fix after the phase"
        required: false
        type: boolean
        default: true
  schedule:
    # Cron = the retry engine. Every 10 min, a cheap check: only runs work if
    # a phase is pending or deferred. Near-zero minutes when idle.
    - cron: "*/10 * * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: llops-pipeline
  cancel-in-progress: false

env:
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  OPENCODE_MODEL: opencode/big-pickle,opencode/nemotron-3-ultra-free,openrouter/nvidia/nemotron-3-super-120b-a12b:free,opencode/nemotron-3.5-lightning-free,opencode/mimo-v2.5-free,opencode/muse-spark-1.2-contributor-free
jobs:
  select-phase:
    # Fix 4: no checkout — read marker files via the GitHub API (one trees call,
    # ~1-2s). Idle ticks cost only VM boot + this tiny step.
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
      exists: ${{ steps.phase.outputs.exists }}
      timeout: ${{ steps.phase.outputs.timeout }}
    steps:
      - name: Select phase via API
        id: phase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fix 4: no checkout — read marker files via the GitHub API (one trees
          # call, ~1-2s). Idle ticks cost only VM boot + this tiny step.
          gh api "repos/${GITHUB_REPOSITORY}/git/trees/HEAD?recursive=1" --jq '.tree[].path' > /tmp/tree.txt
          mkdir -p /tmp/phases
          # Collect distinct phase names: workspace/phase-NN
          grep -E '^workspace/phase-[0-9]+/' /tmp/tree.txt | cut -d/ -f2 | sort -V -u > /tmp/phase_names.txt
          while read -r name; do
            [ -n "$name" ] || continue
            grep -qx "workspace/${name}/.done"     /tmp/tree.txt && touch "/tmp/phases/${name}.done"
            grep -qx "workspace/${name}/.deferred" /tmp/tree.txt && touch "/tmp/phases/${name}.deferred"
            grep -qx "workspace/${name}/.blocked"  /tmp/tree.txt && touch "/tmp/phases/${name}.blocked"
            grep -qx "workspace/${name}/.attempts" /tmp/tree.txt && touch "/tmp/phases/${name}.attempts"
          done < /tmp/phase_names.txt

          # Read a phase's timeout marker via the API (default 60 min).
          phase_timeout() {
            local n="$1" t
            t=$(gh api "repos/${GITHUB_REPOSITORY}/contents/workspace/${n}/.timeout" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null | tr -d '[:space:]')
            if [ -n "$t" ] && [ "$t" -ge 1 ] 2>/dev/null; then printf '%s' "$t"; else printf '60'; fi
          }

          # Manual dispatch override.
          if [ -n "${{ inputs.phase }}" ]; then
            echo "phase=${{ inputs.phase }}" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "timeout=$(phase_timeout ${{ inputs.phase }})" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 0) hard stop — create workspace/.stop to halt the pipeline
          if grep -qx "workspace/.stop" /tmp/tree.txt; then
            echo "::notice::workspace/.stop present — pipeline halted."
            echo "phase=" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 1) resume a deferred phase first (rate-limited earlier)
          for d in $(ls /tmp/phases/*.deferred 2>/dev/null | sort -V); do
            name="$(basename "$d" .deferred)"
            echo "phase=${name}" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "timeout=$(phase_timeout "${name}")" >> "$GITHUB_OUTPUT"
            exit 0
          done

          # 2) else pick the lowest phase WITHOUT .done AND WITHOUT .blocked
          while read -r name; do
            [ -n "$name" ] || continue
            if [ ! -f "/tmp/phases/${name}.done" ] && [ ! -f "/tmp/phases/${name}.blocked" ]; then
              echo "phase=${name}" >> "$GITHUB_OUTPUT"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "timeout=$(phase_timeout "${name}")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < /tmp/phase_names.txt

          # Fix 8: surface blocked phases on EVERY tick (not only when idle)
          BLOCKED=$(ls /tmp/phases/*.blocked 2>/dev/null | wc -l)
          if [ "${BLOCKED}" -gt 0 ]; then
            echo "::warning::${BLOCKED} blocked phase(s) need manual intervention: $(ls /tmp/phases/*.blocked 2>/dev/null | xargs -n1 basename | sed 's/.blocked//' | tr '\n' ' ')"
          fi
          echo "phase=" >> "$GITHUB_OUTPUT"
          echo "exists=false" >> "$GITHUB_OUTPUT"

  run-phase:
    needs: select-phase
    if: needs.select-phase.outputs.exists == 'true'
    runs-on: ubuntu-latest
    # Fix 6: per-phase timeout (workspace/<phase>/.timeout), default 60 min.
    timeout-minutes: ${{ fromJSON(needs.select-phase.outputs.timeout) }}
    outputs:
      phase: ${{ steps.run.outputs.phase }}
      done: ${{ steps.commit.outputs.done }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest
          sdk: platforms;android-36,build-tools;36.0.0,ndk;27.0.12077973,cmake;3.22.1

      - name: Install opencode (pinned 1.15.12 — CLI has no --prompt flag; message is positional)
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.15.12
          ~/.opencode/bin/opencode --version 2>/dev/null || opencode --version

      - name: Pull latest main
        run: git pull --ff-only origin main || true

      # Phase-117 / phase-159 (Build Release APK) need the release keystore to
      # run `gradle assembleRelease`. Restore it BEFORE the phase step. The
      # keystore lives OUTSIDE the repo tree ($RUNNER_TEMP) —
      # B1Plat01ReleaseSigningTest fails if any *.keystore file is inside the
      # checkout.
      - name: Restore Release Keystore (for phase-117/159 release build)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "release.keystore restored to $RUNNER_TEMP ($(wc -c < "$RUNNER_TEMP/release.keystore") bytes)"
          else
            echo "::warning::RELEASE_KEYSTORE_B64 unset - release build phases will fail closed (expected)."
          fi

      # Phase-118 / phase-160 (Kali dynamic pentest) must NOT spend its budget
      # building the APK — pre-download the artifact the build phase uploaded so
      # Kali has it on disk.
      - name: Download release APK artifact for Kali (phase-118/160)
        if: needs.select-phase.outputs.phase == 'phase-118' || needs.select-phase.outputs.phase == 'phase-160'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=noteflow-release-apk&per_page=1" --jq '.artifacts[0].id' 2>/dev/null || echo "")
          if [ -n "$ARTIFACT_ID" ] && [ "$ARTIFACT_ID" != "null" ]; then
            mkdir -p /tmp/release-apk
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/release-apk/artifact.zip
            mkdir -p app/build/outputs/apk/release
            unzip -o /tmp/release-apk/artifact.zip -d app/build/outputs/apk/release
            echo "Downloaded noteflow-release-apk:"
            ls -la app/build/outputs/apk/release/
          else
            echo "::warning::No noteflow-release-apk artifact found - Kali must build or skip."
          fi

      # Fix 9: commit the phase work BEFORE review. If the review (or the job)
      # times out, the phase is already pushed — a timeout can no longer destroy it.
      - name: Run phase (no review — phase work committed first)
        id: run
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x scripts/phase_runner.sh
          bash scripts/phase_runner.sh "${{ needs.select-phase.outputs.phase }}"
          echo "phase=${{ needs.select-phase.outputs.phase }}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Commit and push phase work (pull-rebase-retry so concurrent human pushes don't lose the bot's work)
        id: commit
        run: |
          git config user.name "llops-bot"
          git config user.email "llops-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "llops: ${{ needs.select-phase.outputs.phase }}"
            PUSHED=0
            for i in 1 2 3 4 5; do
              if git push origin main; then
                echo "push succeeded on attempt $i"
                PUSHED=1
                break
              fi
              echo "push rejected (attempt $i) — pulling latest and rebasing..."
              git pull --rebase origin main || true
              sleep 3
            done
            # Fix 2: never lose the bot's commit — recovery branch + patch artifact
            if [ "${PUSHED}" = "0" ]; then
              echo "::error::Push to main failed after 5 attempts — saving work to a recovery branch + patch artifact."
              git branch -f "llops-recovery/${{ needs.select-phase.outputs.phase }}" HEAD
              git push origin "llops-recovery/${{ needs.select-phase.outputs.phase }}" --force || true
              git format-patch --stdout -1 > "llops-${{ needs.select-phase.outputs.phase }}.patch" || true
            fi
          fi
          # Report the final state so the status step can judge correctly.
          if [ -f "workspace/${{ needs.select-phase.outputs.phase }}/.done" ]; then
            echo "BOT_DONE=true" >> "$GITHUB_ENV"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release APK artifact (phase-117/159 build phase)
        if: needs.select-phase.outputs.phase == 'phase-117' || needs.select-phase.outputs.phase == 'phase-159'
        continue-on-error: true   # artifact quota failures must never fail the run
        uses: actions/upload-artifact@v7
        with:
          name: noteflow-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload recovery patch (if push failed)
        if: always()
        continue-on-error: true   # artifact quota failures must never fail the run
        uses: actions/upload-artifact@v7
        with:
          name: llops-recovery-${{ needs.select-phase.outputs.phase }}
          path: |
            llops-${{ needs.select-phase.outputs.phase }}.patch
            logs/${{ needs.select-phase.outputs.phase }}.log
          if-no-files-found: ignore

      - name: Report status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PHASE="${{ needs.select-phase.outputs.phase }}"
          if [ -f "workspace/${PHASE}/.deferred" ]; then
            echo "::notice::Rate limit hit — deferred. Next cron tick retries in <=30 min."
          elif [ -f "workspace/${PHASE}/.done" ]; then
            echo "::notice::Phase completed. Pipeline advanced."
          elif [ -f "workspace/${PHASE}/.blocked" ]; then
            echo "::error::Phase blocked after max attempts — manual intervention needed."
            # Fix 3: notify via a GitHub issue (deduped so cron doesn't spam)
            EXISTS=$(gh issue list --state open --search "LLOPS blocked ${PHASE}" --json number --jq 'length' 2>/dev/null || echo 0)
            if [ "$EXISTS" = "0" ]; then
              { echo "Phase **${PHASE}** is blocked — the pipeline will skip it until fixed.";
                echo "";
                echo "## Log tail";
                echo '```';
                tail -60 "logs/${PHASE}.log" 2>/dev/null || echo "(no log)";
                echo '```';
                echo "";
                echo "Fix the cause, then remove \`workspace/${PHASE}/.blocked\` and \`workspace/${PHASE}/.attempts\` and push."; } > /tmp/issue-body.md
              gh issue create --title "LLOPS blocked: ${PHASE}" --body-file /tmp/issue-body.md || true
            fi
          else
            echo "::error::Phase failed for a non-rate-limit reason — check logs."
          fi

  # Fix 11: review runs as its OWN job with its own timeout budget, so the phase
  # work (which commits first) can never starve the review of time. Previously
  # review shared the run-phase job's timeout and was cancelled mid-run whenever
  # phase work consumed most of the budget — losing the review fixes entirely.
  review:
    needs: [select-phase, run-phase]
    if: needs.select-phase.outputs.exists == 'true' && needs.run-phase.outputs.done == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest
          sdk: platforms;android-36,build-tools;36.0.0,ndk;27.0.12077973,cmake;3.22.1

      - name: Install opencode (pinned 1.15.12 — CLI has no --prompt flag; message is positional)
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.15.12
          ~/.opencode/bin/opencode --version 2>/dev/null || opencode --version

      - name: Pull latest main
        run: git pull --ff-only origin main || true

      - name: Review and fix phase (dedicated 90-min budget)
        id: review
        run: |
          bash scripts/phase_runner.sh "${{ needs.select-phase.outputs.phase }}" --review-only
        continue-on-error: true

      - name: Commit and push review fixes
        run: |
          git config user.name "llops-bot"
          git config user.email "llops-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no review changes to commit"
          else
            git commit -m "llops: ${{ needs.select-phase.outputs.phase }} review fixes"
            PUSHED=0
            for i in 1 2 3 4 5; do
              if git push origin main; then
                echo "push succeeded on attempt $i"
                PUSHED=1
                break
              fi
              echo "push rejected (attempt $i) — pulling latest and rebasing..."
              git pull --rebase origin main || true
              sleep 3
            done
            if [ "${PUSHED}" = "0" ]; then
              echo "::error::Push of review fixes failed after 5 attempts — saving to recovery branch + patch."
              git branch -f "llops-recovery/${{ needs.select-phase.outputs.phase }}" HEAD
              git push origin "llops-recovery/${{ needs.select-phase.outputs.phase }}" --force || true
              git format-patch --stdout -1 > "llops-${{ needs.select-phase.outputs.phase }}-review.patch" || true
            fi
          fi

      - name: Upload recovery patch (review fixes)
        if: always()
        continue-on-error: true   # artifact quota failures must never fail the run
        uses: actions/upload-artifact@v7
        with:
          name: llops-recovery-${{ needs.select-phase.outputs.phase }}-review
          path: |
            llops-${{ needs.select-phase.outputs.phase }}-review.patch
            logs/${{ needs.select-phase.outputs.phase }}.review.log
            logs/${{ needs.select-phase.outputs.phase }}.fix.log
          if-no-files-found: ignore
