name: Android CI Build

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:

# Skip the redundant CI run when the llops-bot commits phase work — those phases
# already run `gradle testDebugUnitTest` + `gradle assembleDebug` as their DoD.
# Without this, every phase that touches app/ doubles the Actions minutes.
# Human pushes and PRs still get full CI.
jobs:
  build:
    if: github.actor != 'llops-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.13"

      - name: Clean Native C++ Cache
        run: rm -rf .cxx app/.cxx
      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Signed Release APK
        run: gradle assembleRelease

      # No artifact uploads here — that drained the Actions storage quota.
      # Release APK artifacts are produced by release.yml on v* tags only.
