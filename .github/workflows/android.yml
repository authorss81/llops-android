name: Android CI Build

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:

# Skip the redundant CI run when the llops-bot commits phase work — those phases
# already run `gradle testDebugUnitTest` + `gradle assembleDebug` as their DoD.
# Without this, every phase that touches app/ doubles the Actions minutes.
# Human pushes and PRs still get full CI.
jobs:
  build:
    if: github.actor != 'llops-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.13"

      - name: Clean Native C++ Cache
        run: rm -rf .cxx app/.cxx

      - name: Restore Release Keystore (B1-PLAT-1)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          # Keystore goes OUTSIDE the checkout tree: B1Plat01ReleaseSigningTest
          # walks the whole repo tree and fails if any *.keystore file exists in it.
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "release.keystore restored to $RUNNER_TEMP ($(wc -c < "$RUNNER_TEMP/release.keystore") bytes)"
          else
            echo "::warning::RELEASE_KEYSTORE_B64 secret is unset - release build will fail closed (B1-PLAT-1)."
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      # No artifact uploads here — that drained the Actions storage quota.
      # Release APK artifacts are produced by release.yml on v* tags only.
