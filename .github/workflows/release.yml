name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Clean Native C++ Cache
        run: rm -rf .cxx app/.cxx

      - name: Restore Release Keystore (B1-PLAT-1)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          # Keystore goes OUTSIDE the checkout tree: B1Plat01ReleaseSigningTest
          # walks the whole repo tree and fails if any *.keystore file exists in it.
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "release.keystore restored to $RUNNER_TEMP ($(wc -c < "$RUNNER_TEMP/release.keystore") bytes)"
          else
            echo "::warning::RELEASE_KEYSTORE_B64 secret is unset - release build will fail closed (B1-PLAT-1)."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload arm64-v8a Release APK (phone)
        uses: actions/upload-artifact@v7
        with:
          name: noteflow-arm64-v8a
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload universal Release APK (all ABIs)
        uses: actions/upload-artifact@v7
        with:
          name: noteflow-universal
          path: app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: error

      - name: Build Debug APK (as fallback downloadable APK)
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: noteflow-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
