name: llops-dispatcher

# This dispatcher triggers the main `llops` workflow when a previous run
# completes. GitHub prevents a workflow from triggering itself (see
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows),
# so we need a separate workflow for the self-perpetuating chain.
#
# How it works:
# 1. `llops` workflow finishes (success, failure, or cancelled)
# 2. This dispatcher fires on `workflow_run: completed`
# 3. It checks if there's pending work via the GitHub API
# 4. If yes, it dispatches a repository_dispatch event
# 5. The main `llops` workflow has a `repository_dispatch` trigger that
#    accepts this and starts a new run
# 6. When that run finishes, the dispatcher fires again
#
# Why repository_dispatch (not gh workflow run): the default GITHUB_TOKEN
# has `contents: write` but NOT `workflow` scope, so `gh workflow run`
# and the `actions/workflows/{id}/dispatches` endpoint return 403. The
# `repository_dispatch` event has different auth requirements and works
# with the default token, so we use that. llops.yml has a
# `repository_dispatch` trigger to accept this.

on:
  workflow_run:
    workflows: ["llops"]
    types: [completed]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Wait briefly so the previous run's commit step fully settles
        run: sleep 5
      - name: Check if there's work to do
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read .done markers via the API (no checkout needed)
          gh api "repos/$GITHUB_REPOSITORY/git/trees/HEAD?recursive=1" --jq '.tree[].path' > /tmp/tree.txt
          # Find the lowest phase WITHOUT .done AND WITHOUT .blocked
          for name in $(grep -E '^workspace/phase-[0-9]+/' /tmp/tree.txt | cut -d/ -f2 | sort -V -u); do
            if ! gh api "repos/$GITHUB_REPOSITORY/contents/workspace/${name}/.done" --silent 2>/dev/null; then
              if ! gh api "repos/$GITHUB_REPOSITORY/contents/workspace/${name}/.blocked" --silent 2>/dev/null; then
                echo "::notice::Work to do: $name - dispatching llops"
                exit 0
              fi
            fi
          done
          echo "::notice::No work to do, skipping dispatch"
          exit 1
      - name: Dispatch llops workflow via repository_dispatch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use repository_dispatch (not workflow_dispatch) because the default
          # GITHUB_TOKEN does not have the workflow scope needed to trigger
          # other workflows via the actions/dispatches endpoint. The
          # repository_dispatch endpoint has different auth requirements and
          # works with the default contents: write token. llops.yml must have
          # a matching `repository_dispatch` trigger to accept this event.
          echo "::notice::Dispatching llops via repository_dispatch"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "User-Agent: llops-dispatcher" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            -d '{"event_type":"phase-pipeline","client_payload":{"ref":"'"$GITHUB_REF_NAME"'"}}' 2>&1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" = "204" ]; then
            echo "::notice::Successfully dispatched llops"
          else
            echo "::error::Failed to dispatch: HTTP $HTTP_CODE"
            exit 1
          fi
