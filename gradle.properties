org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Phase 211: build performance flags.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# Phase 211: non-final R fields (AGP generates a runtime lookup table instead
# of compile-time constants). Safe here: there is NO getIdentifier()/dynamic
# resource lookup in the app source (re-verified phase-211; see also the
# shrinkResources safety note in app/build.gradle.kts) and no Java source
# that could `switch` on R constants; all modules are Kotlin.
android.nonFinalResIds=true
android.suppressUnsupportedCompileSdk=36
# Phase 211 (trial): configuration cache. Validated against the three known
# configuration-time hazards BEFORE landing:
#  - B1-PLAT-1 signing gate (`gradle.taskGraph.whenReady`): fires at execution
#    time under CC — fail-closed refusal without a keystore re-verified below.
#  - splits DSL reading `gradle.startParameter.taskNames` (:192): task names are
#    part of the CC entry key, so debug/release invocations get distinct cached
#    configurations — split activation verified unchanged both ways.
#  - Paparazzi plugin: task wiring resolves under CC (record/verify tasks
#    discoverable). See workspace/phase-211/REPORT.md for the full matrix.
org.gradle.configuration-cache=true
# Phase 199 (PERF 2.3): R8 FULL mode (default missing-keep inference off,
# more aggressive optimization/obfuscation than compat mode). Safety nets added
# in the same phase, verified by source scan:
#  - plugin-sdk's shared plugin ABI keeps its names via its bundled
#    consumer-rules.pro (-keep com.authorss81.noteflow.plugins.**) so
#    downloadable DexClassLoader plugins keep class identity with the host;
#  - Gson DTOs that rely on field-name==JSON-key (no @SerializedName) keep
#    their member names via scoped -keepclassmembers rules in
#    app/proguard-rules.pro (weather/dictionary/websearch/localsend/
#    brush-presets/hosted-manifest);
#  - existing rules already cover data.model/** Gson round-trip and
#    PluginEntryCodec$PluginEntryDto.
android.enableR8.fullMode=true
