[versions]
agp = "8.7.3"
# Phase 195: JVM screenshot-render suite (Paparazzi, test-only, NO emulator).
# 2.0.0-alpha01 (2025-04-15) is the newest release whose runtime jars are
# compiled with Kotlin 2.0.21 — the version THIS project pins. The alpha02+
# line is built with Kotlin 2.1.21/2.3.0, whose kotlin_module metadata the
# pinned Kotlin 2.0.21 compiler refuses to read ("binary version of its
# metadata is 2.3.0, expected 2.0.0"), so those versions are unusable without
# a broad Kotlin bump. alpha01's own Gradle Plugin was tested on Gradle 8.13
# (this project's pin) and AGP 8.8.1 (we are on 8.7.3), and its LayoutLib
# 15.1.4 was verified in the Phase 195 smoke test to render this app's
# Compose screens. The 2.0.0-alpha05 "HtmlWriterTools / configuration-cache"
# fixes target Gradle 9.x consumers and are NOT needed on Gradle 8.13.
paparazzi = "2.0.0-alpha01"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
room = "2.6.1"
# Phase 211: navigationCompose + coil versions/entries REMOVED — the deps were
# declared but never referenced by any module (grep-verified).
gson = "2.11.0"
biometric = "1.1.0"
ink = "1.0.0"
sqlcipher = "4.9.0"
sqliteKtx = "2.4.0"
commonmark = "0.29.0"
mlkitTextRecognition = "16.0.1"
# Phase 16: on-device translation (ML Kit translate, keyless) + local LLM runtime
# (MediaPipe tasks-genai, the Google AI Edge engine LiteRT-LM extends; chosen over
# litertlm-android because every litertlm artifact ships Kotlin-2.2 metadata that
# this project's pinned Kotlin 2.0.21 cannot read).
mlkitTranslate = "17.0.3"
mediapipeTasksGenai = "0.10.25"
# Phase 15: productivity/knowledge plugin pack (pure-JVM, CI-testable).
lingua = "1.2.2"
# B2-DEPS-01 (phase-97): CVE-2026-71497 / GHSA-pmhh-3w7g-xqp8 (Cleaner may
# expose markup when custom Safelists permit raw-text elements) affects
# org.jsoup:jsoup >= 1.14.3, < 1.23.1 — pinned to 1.23.1, the security-fixed line.
jsoup = "1.23.1"
coroutines = "1.9.0"
# Phase 131: junit 4 test runner — single catalog entry so app + downloadable
# plugin modules (plugins/llm) reference the SAME version through libs.junit.
junit = "4.13.2"
# Phase 179: syntax highlighting for fenced code blocks. The name that resolves
# is dev.snipme:highlights (pure-Kotlin highlight.js-style tokenizer, Apache-2.0,
# published for jvm/native — Android consumes the jvm variant, kotlin-stdlib
# 1.9.23 -> upgraded to the project's 2.0.21). 0.9.3 (built on Kotlin 1.9) is
# deliberately pinned over 1.x: the 1.x line is built on Kotlin 2.2 metadata that
# this project's pinned Kotlin 2.0.21 cannot read.
highlights = "0.9.3"
# Phase 196: OS-level stylus/touch motion prediction (androidx.input).
# input-motionprediction 1.0.0 is the stable release; it is plain-Java AndroidX
# (no Kotlin metadata, no native code, ~tens of KB of dex), so it does NOT trip
# the base-APK heavy-dep rule (ML Kit / MediaPipe class) and is safe with the
# pinned Kotlin 2.0.21 toolchain.
motionPrediction = "1.0.0"
# Phase 199 (PERF 2.2+2.3): baseline-profile toolchain. Pinned to the 1.3.4
# STABLE line (not 1.4+/1.5-alpha) for the same reason as paparazzi/highlights
# above: newer lines are built against newer Kotlin metadata that the pinned
# Kotlin 2.0.21 compiler cannot read. 1.3.4 supports AGP 8.4+ (we are on
# 8.7.3) and carries the consumer/producer baseline-profile Gradle plugins.
androidxBenchmark = "1.3.4"
# Phase 199: explicit profileinstaller pin (was transitive 1.3.1 via
# androidx.activity) so the on-device profile install path is deterministic.
profileinstaller = "1.4.1"
# Phase 199: :baselineprofile module test-toolchain deps (UiAutomator drives
# cold-start/open-note/first-stroke flows on a device; ext-junit provides the
# instrumentation runner). Both plain-Java-heavy, both google()-hosted.
uiAutomator = "2.3.0"
androidxTestExtJunit = "1.2.1"

[libraries]
androidx-ink-authoring = { group = "androidx.ink", name = "ink-authoring", version.ref = "ink" }
androidx-ink-brush = { group = "androidx.ink", name = "ink-brush", version.ref = "ink" }
androidx-ink-rendering = { group = "androidx.ink", name = "ink-rendering", version.ref = "ink" }
androidx-ink-geometry = { group = "androidx.ink", name = "ink-geometry", version.ref = "ink" }
androidx-ink-strokes = { group = "androidx.ink", name = "ink-strokes", version.ref = "ink" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite-ktx = { group = "androidx.sqlite", name = "sqlite-ktx", version.ref = "sqliteKtx" }
commonmark = { group = "org.commonmark", name = "commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { group = "org.commonmark", name = "commonmark-ext-gfm-tables", version.ref = "commonmark" }

# Phase 12: on-device, offline OCR (bundled model — no Play Services, no API key,
# no INTERNET). Latin script by default; per-language scripts add their own model.
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

# Phase 16: on-device translation + local LLM assistant (keyless, offline-first).
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkitTranslate" }
mediapipe-tasks-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipeTasksGenai" }

# Phase 15: Lingua (natural-language detection) + jsoup (readable-content extraction).
# Both pure JVM, Apache-2.0, no native code — fully unit-testable in CI.
lingua = { group = "com.github.pemistahl", name = "lingua", version.ref = "lingua" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# Phase 179: pure-Kotlin syntax highlighting (highlight.js-style grammars) for
# fenced code blocks in the markdown renderers. Apache-2.0, no native code,
# no transitive deps beyond kotlin-stdlib — CI-testable and base-APK-lean.
highlights = { group = "dev.snipme", name = "highlights", version.ref = "highlights" }

# Phase 196: stylus motion prediction (androidx.input:input-motionprediction).
# Pure-Java AndroidX, no native libs, no permissions — a latency feature for the
# ink canvas, not a heavy downloadable-plugin-class dependency.
androidx-input-motionprediction = { group = "androidx.input", name = "input-motionprediction", version.ref = "motionPrediction" }

# Phase 199 (PERF 2.2+2.3): baseline-profile toolchain. profileinstaller is a
# tiny (~tens of KB) runtime lib that installs assets/dexopt/baseline.prof on
# API < 33 devices at first run (API 33+ reads it natively during install);
# benchmark-macro-junit4 + uiautomator + ext-junit live ONLY in the
# :baselineprofile test module — never in either APK.
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiAutomator" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

# Phase 29: downloadable LLM plugin module — explicit coroutines dependency (the
# base app gets it transitively via lifecycle; the plugin module declares it).
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Phase 31: kotlinx-coroutines-test — JVM-only; lets unit tests install a Main
# dispatcher so the ViewModel (which eagerly builds stateIn(viewModelScope,..)
# flows) can be constructed in a plain JVM test.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Phase 195: Paparazzi screenshot-render plugin. TEST-ONLY — it wires the
# `recordPaparazziDebug`/`verifyPaparazziDebug` tasks and injects the
# `app.cash.paparazzi:paparazzi` test dependency itself (application-module
# branch of `PaparazziPlugin.addTestDependency()`), so it is NEVER in the
# base APK. Autowired runtime deps (layoutlib native, paparazzi-agent, moshi…)
# exist on the unit-test classpath only.
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
# Phase 199: androidx baseline-profile Gradle plugin (consumer on :app,
# producer on :baselineprofile). Resolves from google() (androidx.* group).
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidxBenchmark" }
# Phase 199: com.android.test plugin for the :baselineprofile device-test module
# (part of AGP, same version as the application plugin).
android-test = { id = "com.android.test", version.ref = "agp" }
