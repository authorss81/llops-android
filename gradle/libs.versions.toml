[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
room = "2.6.1"
navigationCompose = "2.8.5"
coil = "2.7.0"
gson = "2.11.0"
biometric = "1.1.0"
ink = "1.0.0"
sqlcipher = "4.9.0"
sqliteKtx = "2.4.0"
commonmark = "0.29.0"
mlkitTextRecognition = "16.0.1"
# Phase 16: on-device translation (ML Kit translate, keyless) + local LLM runtime
# (MediaPipe tasks-genai, the Google AI Edge engine LiteRT-LM extends; chosen over
# litertlm-android because every litertlm artifact ships Kotlin-2.2 metadata that
# this project's pinned Kotlin 2.0.21 cannot read).
mlkitTranslate = "17.0.3"
mediapipeTasksGenai = "0.10.25"
# Phase 15: productivity/knowledge plugin pack (pure-JVM, CI-testable).
lingua = "1.2.2"
# B2-DEPS-01 (phase-97): CVE-2026-71497 / GHSA-pmhh-3w7g-xqp8 (Cleaner may
# expose markup when custom Safelists permit raw-text elements) affects
# org.jsoup:jsoup >= 1.14.3, < 1.23.1 — pinned to 1.23.1, the security-fixed line.
jsoup = "1.23.1"
coroutines = "1.9.0"

[libraries]
androidx-ink-authoring = { group = "androidx.ink", name = "ink-authoring", version.ref = "ink" }
androidx-ink-brush = { group = "androidx.ink", name = "ink-brush", version.ref = "ink" }
androidx-ink-rendering = { group = "androidx.ink", name = "ink-rendering", version.ref = "ink" }
androidx-ink-geometry = { group = "androidx.ink", name = "ink-geometry", version.ref = "ink" }
androidx-ink-strokes = { group = "androidx.ink", name = "ink-strokes", version.ref = "ink" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-windowsizeclass = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite-ktx = { group = "androidx.sqlite", name = "sqlite-ktx", version.ref = "sqliteKtx" }
commonmark = { group = "org.commonmark", name = "commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { group = "org.commonmark", name = "commonmark-ext-gfm-tables", version.ref = "commonmark" }

# Phase 12: on-device, offline OCR (bundled model — no Play Services, no API key,
# no INTERNET). Latin script by default; per-language scripts add their own model.
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

# Phase 16: on-device translation + local LLM assistant (keyless, offline-first).
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkitTranslate" }
mediapipe-tasks-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipeTasksGenai" }

# Phase 15: Lingua (natural-language detection) + jsoup (readable-content extraction).
# Both pure JVM, Apache-2.0, no native code — fully unit-testable in CI.
lingua = { group = "com.github.pemistahl", name = "lingua", version.ref = "lingua" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# Phase 29: downloadable LLM plugin module — explicit coroutines dependency (the
# base app gets it transitively via lifecycle; the plugin module declares it).
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Phase 31: kotlinx-coroutines-test — JVM-only; lets unit tests install a Main
# dispatcher so the ViewModel (which eagerly builds stateIn(viewModelScope,..)
# flows) can be constructed in a plain JVM test.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
